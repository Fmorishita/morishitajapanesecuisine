<!DOCTYPE html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Prueba 6 s · Morishita</title>
    <!-- GSAP local (vendor/): el render no depende del CDN -->
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0908;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0908;
      }
      /* Las ranuras de sub-composición llenan el cuadro */
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
      #flash {
        z-index: 20;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-6v5m" id="root" data-composition-id="main" data-start="0" data-duration="6" data-fps="30" data-width="1080" data-height="1920">
      <!-- Escena 1 · gancho "1 barra · 4 ASIENTOS" (0 – 2.4 s) -->
      <div data-hf-id="hf-faek" id="el-golpe" data-composition-id="escena-golpe" data-composition-src="compositions/escena-golpe.html" data-start="0" data-duration="2.4" data-track-index="0" data-width="1080" data-height="1920"></div>

      <!-- Escena 2 · captura real del flujo de reserva con punch-in (2.4 – 6 s) -->
      <div data-hf-id="hf-wgcv" id="el-captura" data-composition-id="escena-captura" data-composition-src="compositions/escena-captura.html" data-start="2.4" data-duration="3.6" data-track-index="1" data-width="1080" data-height="1920"></div>

      <!-- Transición: bloque del catálogo editorial-flash-overlay.
           Su golpe cae a 0.58 × duración: la rampa a blanco dura 0.04 s; con inicio 2.07 el pico cae en 2.40 s (el corte) -->
      <div data-hf-id="hf-fz4j" id="flash" data-composition-id="editorial-flash-overlay" data-composition-src="compositions/editorial-flash-overlay.html" data-start="2.07" data-duration="0.5" data-track-index="2" data-width="1080" data-height="1920"></div>

      <!-- SFX: cada <audio> necesita id; data-start en segundos absolutos del reel -->
      <!-- impacto grave en el gancho (pico a 0.07 s del archivo) -->
      <audio data-hf-id="hf-vl4o" id="sfx-impacto" src="assets/sfx/impact-bass-1.mp3" data-start="0" data-duration="2.1" data-track-index="10" data-volume="0.35"></audio>
      <!-- whoosh en la transición: su pico está a 0.16 s → arranca en 2.24 para pegar en 2.40 -->
      <audio data-hf-id="hf-61az" id="sfx-whoosh" src="assets/sfx/whoosh.mp3" data-start="2.24" data-duration="0.57" data-track-index="11" data-volume="0.8"></audio>
      <!-- pop con la palabra clave "4" (3.25 s; pico del archivo a 0.12 s) -->
      <audio data-hf-id="hf-e90a" id="sfx-pop" src="assets/sfx/pop.mp3" data-start="3.13" data-duration="0.72" data-track-index="12" data-volume="0.4"></audio>
    </div>

    <script>
      // Timeline raíz (vacía): la animación vive en cada sub-composición
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
